server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Whole repo root, so new pages/CSS/JS need no compose change.
    root /srv/site;
    # The home page file is literally named "QUAD K.HTML" (space + uppercase).
    index "QUAD K.HTML";

    charset utf-8;

    # Keep repo internals (.git, .base44) off the web.
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
