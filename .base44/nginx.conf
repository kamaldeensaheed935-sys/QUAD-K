# Main nginx config for the QUAD K static site (sandbox dev server).
# The sandbox checkout is owned by root with mode 0700, so the worker process
# runs as root inside this container to be able to read the bind-mounted
# source. This is container-local and does not change the host checkout.
user root;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # nginx's mime.types only maps lowercase extensions, and the home page is
    # literally named "QUAD K.HTML", so map the uppercase extension too --
    # otherwise the browser downloads the page instead of rendering it.
    types {
        text/html HTML;
    }

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
