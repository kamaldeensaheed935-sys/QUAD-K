# Base44 dev environment for the QUAD K static site.
# The site is plain HTML/CSS/JS with no build step, so nginx serves the
# bind-mounted source directly and edits show up on reload.
services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      # Whole repo root, read-only: new pages/CSS/JS need no compose change.
      - ./:/srv/site:ro
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.base44/site.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    labels:
      base44.project: "QUAD K"
      base44.kind: "web"
      base44.port: "3000"
