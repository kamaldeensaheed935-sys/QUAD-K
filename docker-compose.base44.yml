services:
  web:
    image: nginx:alpine
    # The sandbox checkout is root-only (drwx------), so nginx workers must run as
    # root to read the bind-mounted site (default is to drop to the nginx user).
    command: ["sh", "-c", "sed -i 's/^user .*/user root;/' /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    labels:
      base44.project: "QUAD K"
      base44.kind: web
      base44.port: 3000
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/index.html || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: on-failure
