# Base44 sandbox web server for the static QUAD K site.
# Serves the bind-mounted repo directly, so source edits appear on reload.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Never serve VCS metadata or other dotfiles that live beside the site.
    location ~ /\. {
        deny all;
    }

    # Static markup, styles and scripts: no caching, so edits show immediately.
    add_header Cache-Control "no-store";

    location / {
        try_files $uri $uri/ =404;
    }
}
